version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1
  aws-eks: circleci/aws-eks@2.2
  kubernetes: circleci/kubernetes@1.3

executors:
  node:
    docker:
      - image: cimg/node:20.19

  docker-builder:
    docker:
      - image: cimg/base:2024.01

jobs:
  # ─────────────────────────────────────────────
  # BUILD & TEST
  # ─────────────────────────────────────────────
  build-and-test:
    executor: node
    steps:
      - checkout

      - run:
          name: Install pnpm
          command: |
            mkdir -p "$HOME/.local/bin"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            source "$BASH_ENV"

            corepack enable --install-directory "$HOME/.local/bin" pnpm
            corepack prepare pnpm@10.33.0 --activate

            pnpm --version

      - restore_cache:
          keys:
            - pnpm-deps-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile

      - save_cache:
          key: pnpm-deps-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules

      - run:
          name: Build
          command: pnpm build

      - run:
          name: Test
          command: pnpm test

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (DEV)
  # ─────────────────────────────────────────────
  docker-build-dev:
    executor: docker-builder
    steps:
      - checkout

      - setup_remote_docker:
          version: 20.10.24

      - run:
          name: Build and push dev image
          command: |
            set -e

            BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            TAG="${BRANCH}-dev"
            IMAGE_NAME="us9ali/landmark_circleci"

            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "ERROR: DOCKERHUB_USERNAME is empty in CircleCI"
              exit 1
            fi

            if [ -z "$DOCKERHUB_PASSWORD" ]; then
              echo "ERROR: DOCKERHUB_PASSWORD is empty in CircleCI"
              exit 1
            fi

            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            docker build \
              --build-arg NODE_ENV=development \
              -t "${IMAGE_NAME}:${TAG}" \
              -t "${IMAGE_NAME}:dev" \
              .

            docker push "${IMAGE_NAME}:${TAG}"
            docker push "${IMAGE_NAME}:dev"

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (STAGING)
  # ─────────────────────────────────────────────
  docker-build-staging:
    executor: docker-builder
    steps:
      - checkout

      - setup_remote_docker:
          version: 20.10.24

      - run:
          name: Build and push staging image
          command: |
            set -e

            BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-staging"
            IMAGE_NAME="us9ali/landmark_circleci"

            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "ERROR: DOCKERHUB_USERNAME is empty in CircleCI"
              exit 1
            fi

            if [ -z "$DOCKERHUB_PASSWORD" ]; then
              echo "ERROR: DOCKERHUB_PASSWORD is empty in CircleCI"
              exit 1
            fi

            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            docker build \
              --build-arg NODE_ENV=staging \
              -t "${IMAGE_NAME}:${TAG}" \
              -t "${IMAGE_NAME}:staging" \
              .

            docker push "${IMAGE_NAME}:${TAG}"
            docker push "${IMAGE_NAME}:staging"

            mkdir -p /tmp/image-info
            echo "$IMAGE_NAME" > /tmp/image-info/image_name.txt
            echo "$TAG" > /tmp/image-info/image_tag.txt

            echo "Saved image for staging deploy: ${IMAGE_NAME}:${TAG}"

      - persist_to_workspace:
          root: /tmp
          paths:
            - image-info

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (PRODUCTION)
  # ─────────────────────────────────────────────
  docker-build-prod:
    executor: docker-builder
    steps:
      - checkout

      - setup_remote_docker:
          version: 20.10.24

      - run:
          name: Build and push prod image
          command: |
            set -e

            BRANCH=$(echo "$CIRCLE_BRANCH" | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-production"
            IMAGE_NAME="us9ali/landmark_circleci"

            if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "ERROR: DOCKERHUB_USERNAME is empty in CircleCI"
              exit 1
            fi

            if [ -z "$DOCKERHUB_PASSWORD" ]; then
              echo "ERROR: DOCKERHUB_PASSWORD is empty in CircleCI"
              exit 1
            fi

            echo "$DOCKERHUB_PASSWORD" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

            docker build \
              --build-arg NODE_ENV=production \
              -t "${IMAGE_NAME}:${TAG}" \
              -t "${IMAGE_NAME}:production" \
              .

            echo "docker build completed"

            docker push "${IMAGE_NAME}:${TAG}"
            docker push "${IMAGE_NAME}:production"

            mkdir -p /tmp/image-info
            echo "$IMAGE_NAME" > /tmp/image-info/image_name.txt
            echo "$TAG" > /tmp/image-info/image_tag.txt

            echo "Saved image for production deploy: ${IMAGE_NAME}:${TAG}"

      - persist_to_workspace:
          root: /tmp
          paths:
            - image-info

  # ─────────────────────────────────────────────
  # DEPLOY TO STAGING (EKS)
  # ─────────────────────────────────────────────
  deploy-staging:
    executor: docker-builder
    steps:
      - checkout

      - attach_workspace:
          at: /tmp

      - aws-cli/setup

      - kubernetes/install-kubectl

      - run:
          name: Configure kubectl for staging EKS
          command: aws eks update-kubeconfig --name landmark-eks-stg --region "$AWS_REGION"

      - run:
          name: Update image and deploy
          command: |
            set -e

            IMAGE_NAME=$(cat /tmp/image-info/image_name.txt)
            IMAGE_TAG=$(cat /tmp/image-info/image_tag.txt)

            echo "IMAGE_NAME=[$IMAGE_NAME]"
            echo "IMAGE_TAG=[$IMAGE_TAG]"

            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: IMAGE_NAME is empty"
              exit 1
            fi

            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty"
              exit 1
            fi

            sed -i "s|image:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" k8s/05-service/deployment-service.yaml

            echo "Modified image line:"
            grep -n "image:" k8s/05-service/deployment-service.yaml

            kubectl apply -f k8s/05-service/deployment-service.yaml

  # ─────────────────────────────────────────────
  # DEPLOY TO PRODUCTION (EKS)
  # ─────────────────────────────────────────────
  deploy-prod:
    executor: docker-builder
    steps:
      - checkout

      - attach_workspace:
          at: /tmp

      - aws-cli/setup

      - kubernetes/install-kubectl

      - run:
          name: Configure kubectl for production EKS
          command: aws eks update-kubeconfig --name landmark-eks --region "$AWS_REGION"

      - run:
          name: Update image and deploy
          command: |
            set -e

            IMAGE_NAME=$(cat /tmp/image-info/image_name.txt)
            IMAGE_TAG=$(cat /tmp/image-info/image_tag.txt)

            echo "IMAGE_NAME=[$IMAGE_NAME]"
            echo "IMAGE_TAG=[$IMAGE_TAG]"

            if [ -z "$IMAGE_NAME" ]; then
              echo "ERROR: IMAGE_NAME is empty"
              exit 1
            fi

            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty"
              exit 1
            fi

            sed -i "s|image:.*|image: ${IMAGE_NAME}:${IMAGE_TAG}|" k8s/05-service/deployment-service.yaml

            echo "Modified image line:"
            grep -n "image:" k8s/05-service/deployment-service.yaml

            kubectl apply -f k8s/05-service/deployment-service.yaml

# ═══════════════════════════════════════════════
# WORKFLOWS
# ═══════════════════════════════════════════════
workflows:
  ci-dev:
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore:
                - main
                - /^release\/.*/
                - /^hotfix\/.*/

      - docker-build-dev:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              ignore:
                - main
                - /^release\/.*/
                - /^hotfix\/.*/

  deploy-to-staging:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: /^release\/.*/

      - docker-build-staging:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              only: /^release\/.*/

      - deploy-staging:
          context: landmark-secrets
          requires:
            - docker-build-staging
          filters:
            branches:
              only: /^release\/.*/

  deploy-to-prod:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/

      - docker-build-prod:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/

      - deploy-prod:
          context: landmark-secrets
          requires:
            - docker-build-prod
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/
