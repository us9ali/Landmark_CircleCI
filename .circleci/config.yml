version: 2.1

orbs:
  aws-cli: circleci/aws-cli@4.1
  aws-eks: circleci/aws-eks@2.2
  kubernetes: circleci/kubernetes@1.3

executors:
  node:
    docker:
      - image: cimg/node:20.0
  docker-builder:
    docker:
      - image: cimg/base:2024.01

jobs:
  # ─────────────────────────────────────────────
  # BUILD & TEST
  # ─────────────────────────────────────────────
build-and-test:
  executor: node
  steps:
    - checkout
    - run:
        name: Install pnpm
        command: |
          mkdir -p "$HOME/.local/bin"
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
          source "$BASH_ENV"

          corepack enable --install-directory "$HOME/.local/bin" pnpm
          corepack prepare pnpm@10.33.0 --activate

          pnpm --version

    - restore_cache:
        keys:
          - pnpm-deps-{{ checksum "pnpm-lock.yaml" }}

    - run:
        name: Install dependencies
        command: pnpm install --no-frozen-lockfile

    - save_cache:
        key: pnpm-deps-{{ checksum "pnpm-lock.yaml" }}
        paths:
          - node_modules

    - run:
        name: Build
        command: pnpm build

    - run:
        name: Test
        command: pnpm test

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (DEV)
  # ─────────────────────────────────────────────
  docker-build-dev:
    executor: docker-builder
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build and push dev image
          command: |
            BRANCH=$(echo $CIRCLE_BRANCH | sed 's/\//-/g')
            TAG="${BRANCH}-dev"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker build -t us9ali/landmark_app_nodejs:${TAG} -t us9ali/landmark_app_nodejs:dev .
            docker push us9ali/landmark_app_nodejs:${TAG}
            docker push us9ali/landmark_app_nodejs:dev

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (STAGING)
  # ─────────────────────────────────────────────
  docker-build-staging:
    executor: docker-builder
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build and push staging image
          command: |
            BRANCH=$(echo $CIRCLE_BRANCH | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-staging"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker build --build-arg NODE_ENV=staging -t us9ali/landmark_app_nodejs:${TAG} -t us9ali/landmark_app_nodejs:staging .
            docker push us9ali/landmark_app_nodejs:${TAG}
            docker push us9ali/landmark_app_nodejs:staging
            echo "export IMAGE_TAG=${TAG}" >> $BASH_ENV

  # ─────────────────────────────────────────────
  # DOCKER BUILD & PUSH (PRODUCTION)
  # ─────────────────────────────────────────────
  docker-build-prod:
    executor: docker-builder
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Build and push prod image
          command: |
            BRANCH=$(echo $CIRCLE_BRANCH | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-prod"
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker build --build-arg NODE_ENV=production -t us9ali/landmark_app_nodejs:${TAG} -t us9ali/landmark_app_nodejs:latest .
            docker push us9ali/landmark_app_nodejs:${TAG}
            docker push us9ali/landmark_app_nodejs:latest
            echo "export IMAGE_TAG=${TAG}" >> $BASH_ENV

  # ─────────────────────────────────────────────
  # DEPLOY TO STAGING (EKS)
  # ─────────────────────────────────────────────
  deploy-staging:
    executor: docker-builder
    steps:
      - checkout
      - aws-cli/setup
      - kubernetes/install-kubectl
      - run:
          name: Configure kubectl for staging EKS
          command: aws eks update-kubeconfig --name landmark-eks-stg --region $AWS_REGION
      - run:
          name: Update image and deploy
          command: |
            BRANCH=$(echo $CIRCLE_BRANCH | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-staging"
            sed -i "s|image:.*|image: us9ali/landmark_app_nodejs:${TAG}|" k8s/05-service/deployment-service.yaml
            kubectl apply -f k8s/05-service/deployment-service.yaml

  # ─────────────────────────────────────────────
  # DEPLOY TO PRODUCTION (EKS)
  # ─────────────────────────────────────────────
  deploy-prod:
    executor: docker-builder
    steps:
      - checkout
      - aws-cli/setup
      - kubernetes/install-kubectl
      - run:
          name: Configure kubectl for production EKS
          command: aws eks update-kubeconfig --name landmark-eks --region $AWS_REGION
      - run:
          name: Update image and deploy
          command: |
            BRANCH=$(echo $CIRCLE_BRANCH | sed 's/\//-/g')
            TAG="${BRANCH}-$(date +'%Y-%m-%d-%H%M%S')-prod"
            sed -i "s|image:.*|image: us9ali/landmark_app_nodejs:${TAG}|" k8s/05-service/deployment-service.yaml
            kubectl apply -f k8s/05-service/deployment-service.yaml

# ═══════════════════════════════════════════════
# WORKFLOWS
# ═══════════════════════════════════════════════
workflows:
  ci-dev:
    jobs:
      - build-and-test:
          filters:
            branches:
              ignore:
                - main
                - /^release\/.*/
                - /^hotfix\/.*/
      - docker-build-dev:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              ignore:
                - main
                - /^release\/.*/
                - /^hotfix\/.*/

  deploy-to-staging:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: /^release\/.*/
      - docker-build-staging:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              only: /^release\/.*/
      - deploy-staging:
          context: landmark-secrets
          requires:
            - docker-build-staging
          filters:
            branches:
              only: /^release\/.*/

  deploy-to-prod:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/
      - docker-build-prod:
          context: landmark-secrets
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/
      - deploy-prod:
          context: landmark-secrets
          requires:
            - docker-build-prod
          filters:
            branches:
              only:
                - main
                - /^hotfix\/.*/
